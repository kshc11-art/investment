name: Global Stock Screener

on:
  schedule:
    # 매일 UTC 23:00 (KST 08:00) 실행 - NXT 프리마켓 직후, 최신 데이터
    - cron: '0 23 * * *'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      full_run:
        description: '전체 종목 수집 (기본: 제한된 수)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 최대 60분

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance openpyxl pandas requests beautifulsoup4 lxml numpy pykrx finance-datareader

      - name: Run screener
        env:
          TZ: Asia/Seoul
        run: |
          echo "🚀 글로벌 스크리너 v3.2.0 시작"
          echo "현재 시간: $(date)"
          
          # JSON만 출력 (PWA용)
          python global_screener_v3.py --json-only --output-dir ./data
          
          echo "✅ 완료"
          ls -la ./data/

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # data 폴더의 변경사항 추가
          git add data/
          
          # 변경사항이 있을 때만 커밋
          if git diff --staged --quiet; then
            echo "📝 변경사항 없음"
          else
            git commit -m "📊 데이터 업데이트: $(date +'%Y-%m-%d %H:%M') KST"
            git push
            echo "✅ 데이터 푸시 완료"
          fi

      - name: Upload artifacts (optional)
        uses: actions/upload-artifact@v4
        if: failure()  # 실패 시에만 업로드
        with:
          name: screener-logs
          path: |
            ./data/
            ./*.log
          retention-days: 7
